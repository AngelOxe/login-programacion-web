<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inicio de sesión</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <h1>Iniciar sesión</h1>

            <p class="subtitulo">
                Ingresa tus datos para acceder al sistema
            </p>

            <form id="formLogin">

                <!-- Correo -->
                <div class="mb-3">

                    <label
                        for="correo"
                        class="form-label"
                    >
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="correo"
                        placeholder="ejemplo@correo.com"
                        autocomplete="email"
                    >

                    <div
                        id="errorCorreo"
                        class="mensaje-error"
                    ></div>

                </div>


                <!-- Contraseña -->
                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                    >

                    <div
                        id="errorPassword"
                        class="mensaje-error"
                    ></div>

                </div>


                <!-- Botón -->
                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >
                    Ingresar
                </button>

            </form>

        </section>

    </main>


    <!-- Librería de funciones -->
    <script src="js/utileria.js"></script>

    <!-- Funciones específicas del login -->
    <script src="js/login.js"></script>

</body>
</html>
