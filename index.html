<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos navbar -->
    <link rel="stylesheet" href="css/navbar.css">

    <!-- Estilos index -->
    <link rel="stylesheet" href="css/index.css">
</head>

<body>

    <!-- navbar  -->
    <div id="navbar-container"></div>

    <!-- Menú lateral -->
<aside id="sidebar" class="sidebar">

    <div class="sidebar-titulo">
        Menú
    </div>

    <button
        type="button"
        id="btnUsuarios"
        class="sidebar-opcion"
    >
        <span>👥</span>
        <span>Usuarios</span>
        <span id="flechaUsuarios">▼</span>
    </button>

    <div id="submenuUsuarios" class="submenu">

        <button
            type="button"
            id="btnCaptura"
            class="submenu-opcion"
        >
            Captura
        </button>

    </div>

</aside>


<!-- Contenido principal -->
<main id="contenidoPrincipal" class="contenido-principal">

   <h1>Bienvenido al sistema</h1>

<p id="mensajeBienvenida">
    Selecciona una opción del menú.
</p>

<!-- Formulario de captura de usuario -->
<section id="seccionCaptura" class="seccion-formulario">

    <h2>Captura de usuario</h2>

    <form id="formUsuario">

        <!-- Nombre -->
        <div class="mb-3">
            <label for="nombreUsuario" class="form-label">
                Nombre
            </label>

            <input
                type="text"
                id="nombreUsuario"
                class="form-control"
                placeholder="Ingresa tu nombre"
            >

            <div id="errorNombre" class="mensaje-error"></div>
        </div>


        <!-- Correo -->
        <div class="mb-3">
            <label for="correoUsuario" class="form-label">
                Correo electrónico
            </label>

            <input
                type="email"
                id="correoUsuario"
                class="form-control"
                placeholder="correo@ejemplo.com"
            >

            <div id="errorCorreoUsuario" class="mensaje-error"></div>
        </div>


        <!-- Contraseña -->
        <div class="mb-3">
            <label for="passwordUsuario" class="form-label">
                Contraseña
            </label>

            <input
                type="password"
                id="passwordUsuario"
                class="form-control"
                placeholder="Ingresa una contraseña"
            >

            <div id="errorPasswordUsuario" class="mensaje-error"></div>
        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Guardar usuario
        </button>

    </form>

</section>

</main>

    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Utilería -->
    <script src="js/utileria.js"></script>

    <!-- Navbar  -->
    <script src="js/navbar.js"></script>

    <!-- Index  -->
    <script src="js/index.js"></script>

</body>
</html>
